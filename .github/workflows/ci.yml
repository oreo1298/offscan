name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests tools

  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m "not integration and not devmapper and not container"
        env:
          QT_QPA_PLATFORM: offscreen

  system-pyqt6:
    # Ubuntu 24.04 / Mint 22 path: distro Python 3.12 + distro PyQt6 (Qt 6.4).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q python3-pyqt6 python3-pytest
      - run: /usr/bin/python3 -m pytest tests/unit -m "not integration and not devmapper and not container"
        env:
          QT_QPA_PLATFORM: offscreen
          OFFSCAN_QT_API: pyqt6
